<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手帐</title>
<style>
 html,body{margin:0;height:100%;background:#fbf3ea;color:#8f5f5e;
   font:15px/1.7 -apple-system,"PingFang SC",sans-serif}
 .w{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:24px;box-sizing:border-box}
 .d{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(196,122,118,.55);
    animation:s 1.1s linear infinite}
 @keyframes s{to{transform:rotate(360deg)}}
 .h{font-size:17px}
 .s{color:#b08b89;font-size:12.5px;text-align:center}
 a{color:#a85a60}
</style></head><body>
<div class="w">
  <div class="d"></div>
  <div class="h">正在打开你的手帐…</div>
  <div class="s" id="s">正在获取当前入口地址</div>
</div>
<script>
(function(){
  var s=document.getElementById('s');
  function fail(msg){ s.innerHTML=msg; }
  fetch('latest.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('latest.json '+r.status); return r.json(); })
    .then(function(d){
      if(!d || !d.app) throw new Error('没有地址');
      s.textContent='入口 '+(d.at||'')+' · 正在跳转';
      location.replace(d.app);
    })
    .catch(function(e){
      fail('入口暂时取不到（' + e.message + '）<br><br>手机上的隧道可能没起来；<br>连上家里 Wi-Fi 后开 <b>192.168.10.48:9100/__status</b> 看看。');
    });
})();
</script></body></html>
